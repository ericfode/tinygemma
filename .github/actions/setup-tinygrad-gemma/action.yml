name: Setup tinygrad-gemma
description: Set up Python, restore the virtualenv cache, and install tinygrad-gemma.
inputs:
  python-version:
    description: Python version to use.
    required: false
    default: "3.12"
  extras:
    description: Optional dependency extras to install, without brackets.
    required: false
    default: "dev"
  pydeps:
    description: Extra Python packages to install into the virtualenv.
    required: false
    default: ""
  cache-key:
    description: Additional cache key segment for job-specific dependency sets.
    required: false
    default: "default"
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Restore virtualenv cache for pull requests
      if: github.event_name == 'pull_request'
      id: restore-venv-pr
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.venv
        key: venv-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-${{ inputs.cache-key }}-${{ inputs.extras }}-${{ inputs.pydeps }}-${{ env.CACHE_VERSION }}

    - name: Restore and save virtualenv cache
      if: github.event_name != 'pull_request'
      id: restore-venv
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.venv
        key: venv-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-${{ inputs.cache-key }}-${{ inputs.extras }}-${{ inputs.pydeps }}-${{ env.CACHE_VERSION }}

    - name: Install dependencies
      if: steps.restore-venv-pr.outputs.cache-hit != 'true' && steps.restore-venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv .venv
        . .venv/bin/activate
        python -m pip install --upgrade pip wheel
        if [[ -n "${{ inputs.extras }}" ]]; then
          python -m pip install -e ".[${{ inputs.extras }}]" ${{ inputs.pydeps }}
        else
          python -m pip install -e . ${{ inputs.pydeps }}
        fi

    - name: Export virtualenv environment
      shell: bash
      run: |
        echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"
        echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
        echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"
        echo "CACHELEVEL=0" >> "$GITHUB_ENV"
        echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
        echo "MAX_BUFFER_SIZE=300000000" >> "$GITHUB_ENV"
